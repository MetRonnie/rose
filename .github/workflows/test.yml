name: test

on:
  push:
    branches:
      - master
      - '2.*.x'
  pull_request:
  workflow_dispatch:
    inputs:
      rose_ref:
        description: The Rose branch to test against
        required: true
      fcm_ref:
        description: The FCM branch to test against
        required: false
      fcm_repo:
        description: The FCM repo to test against
        required: false
      cylc_flow_tag:
        description: The cylc-flow branch to test against
        required: false
      cylc_flow_repo:
        description: The cylc-flow repo to test against
        required: false
      cylc_rose_tag:
        description: The cylc-rose branch to test against
        required: false
      cylc_rose_repo:
        description: The cylc-rose repo to test against
        required: false
  schedule:
    - cron: '37 04 * * 1-5' # 04:37, Monday-Friday

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -c "exec $CONDA_PREFIX/bin/bash -elo pipefail {0}"

env:
  FORCE_COLOR: 2
  PIP_PROGRESS_BAR: off

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3']

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: rose

      - name: Configure Python
        uses: mamba-org/setup-micromamba@v3
        with:
          cache-environment: true
          post-cleanup: 'all'
          environment-name: rose-test
          create-args: >-
            python=${{ matrix.python-version }}
            bash
            coreutils
            sed
            sqlite
            shellcheck
            sqlite
            pygraphviz
            pygobject>=3.50.0
            gtk3>=3.24.43
            python-ldap

      - name: Configure git  # Configure Git for Git dependent tests.
        uses: cylc/release-actions/configure-git@v1

      - name: Install Node Packages
        working-directory: rose
        run: |
          yarn install

      - run: |
          pip install -e ./rose[tests,docs,rose-edit,graph,rosa,disco,ldap] \
          metomi-isodatetime@git+https://github.com/metomi/isodatetime \
          cylc-flow@git+https://github.com/MetRonnie/cylc-flow@isodatetime \
          cylc-rose@git+https://github.com/cylc/cylc-rose

      - run: pip list

      - name: Checkout FCM
        uses: actions/checkout@v7
        with:
          repository: 'metomi/fcm'
          ref: 'master'
          path: 'fcm'

      - name: Install FCM
        run: |
          # install FCM deps
          sudo apt-get update
          sudo apt-get install -y \
            subversion \
            build-essential \
            gfortran \
            libxml-parser-perl \
            libconfig-inifiles-perl \
            libdbi-perl \
            libdbd-sqlite3-perl

          # prepend FCM bin to $PATH
          FCM_PATH="$GITHUB_WORKSPACE/fcm/bin"
          # the github actions way (needed for cylc jobs)
          echo "$FCM_PATH" >> "${GITHUB_PATH}"
          # the bashrc wat (needed for subsequent gh action steps)
          echo "export PATH=\"$FCM_PATH:\$PATH\"" >> "$HOME/.bashrc"

      - name: Unit Tests
        working-directory: rose
        run: |
          pytest

      - name: Functional Tests
        timeout-minutes: 15
        id: functest
        working-directory: rose
        env:
          OBJC_DISABLE_INITIALIZE_FORK_SAFETY: YES
        run: |
          # rose tests should pass first time around
          etc/bin/rose-test-battery -j 4 --state=save

      - name: Re-Run Fails
        if: failure() && steps.functest.outcome == 'failure'
        timeout-minutes: 5
        working-directory: rose
        env:
          OBJC_DISABLE_INITIALIZE_FORK_SAFETY: YES
        run: |
          # so we only re-run for debug purposes
          cylc scan --state=all --color=never
          etc/bin/rose-test-battery -j 1 -v --state=save,failed

      - name: Upload cylc-run artifact
        if: failure() && steps.functest.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: cylc-run py-${{ matrix.python-version }}
          path: ~/cylc-run/
