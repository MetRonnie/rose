name: test

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -c "exec $CONDA_PREFIX/bin/bash -elo pipefail {0}"

env:
  FORCE_COLOR: 2
  PIP_PROGRESS_BAR: off

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest']
        python-version: ['3', '3.15']

    steps:
      # - name: Checkout
      #   uses: actions/checkout@v7
      #   with:
      #     path: rose

      - name: Configure Python
        uses: mamba-org/setup-micromamba@v3
        with:
          cache-environment: true
          post-cleanup: 'all'
          environment-name: rose-test
          create-args: >-
            python=${{ matrix.python-version }}
            bash
            coreutils
            sed
            sqlite
            shellcheck
            sqlite
            pygraphviz
            pygobject>=3.50.0
            gtk3>=3.24.43
            python-ldap
